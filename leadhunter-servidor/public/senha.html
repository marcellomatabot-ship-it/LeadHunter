<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senha · LeadHunter</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px circle at 30% 20%,#06251b,#030907 60%);color:#e6f5ee;font:15px system-ui,sans-serif;padding:1rem}
form{width:min(390px,100%);padding:2rem;border-radius:18px;border:1px solid #12382b;background:rgba(6,17,13,.7)}
h1{margin:0 0 .4rem;font-size:1.5rem}p{color:#8fb3a3}label{display:block;font-size:.8rem;color:#8fb3a3;margin-top:.8rem}
input{width:100%;margin-top:.3rem;padding:.7rem;border-radius:10px;border:1px solid #12382b;background:#06110d;color:#e6f5ee;font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #4dffb0;outline-offset:2px}
button{width:100%;margin-top:1.2rem;padding:.75rem;border-radius:10px;border:1px solid #10b981;background:#0f9d6f;color:#fff;font:600 1rem system-ui;cursor:pointer}button[disabled]{opacity:.5}
#m{min-height:1.4em;margin-top:.8rem}a{color:#4dffb0;display:block;text-align:center;margin-top:1rem;font-size:.9rem}
</style></head><body>
<form id="f"><h1 id="t"></h1><p id="s"></p><div id="fields"></div><button id="b" type="submit"></button><p id="m" role="status"></p><a href="/entrar">Voltar ao login</a></form>
<script>
var reset=location.pathname==='/redefinir',token=reset?location.hash.slice(1):'';
if(reset)history.replaceState(null,'',location.pathname);
var $=function(s){return document.querySelector(s)};
$('#t').textContent=reset?'Nova senha':'Recuperar senha';
$('#s').textContent=reset?'Escolha uma nova senha de 8 a 72 caracteres.':'Informe seu e-mail para receber o link de redefinição.';
$('#b').textContent=reset?'Salvar nova senha':'Enviar link';
$('#fields').innerHTML=reset?'<label for="p1">Nova senha</label><input id="p1" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><label for="p2">Repita a senha</label><input id="p2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>':'<label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required>';
$('#f').addEventListener('submit',function(ev){ev.preventDefault();var m=$('#m'),b=$('#b');m.textContent='';
var body;if(reset){if($('#p1').value!==$('#p2').value){m.textContent='As senhas não coincidem.';return}body={token:token,password:$('#p1').value}}else body={email:$('#e').value};
b.disabled=true;
fetch(reset?'/api/reset':'/api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){return[r.ok,d]})}).then(function(x){
if(x[0]){m.textContent=reset?'Senha alterada. Você já pode entrar.':x[1].message;if(reset)setTimeout(function(){location.href='/entrar'},1800)}else{m.textContent=x[1].error||'Tente novamente.';b.disabled=false}}).catch(function(){m.textContent='Sem conexão. Tente novamente.';b.disabled=false})});
</script><script src="/cookies.js" defer></script></body></html>
