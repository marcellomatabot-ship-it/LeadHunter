<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · LeadHunter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--em:#10b981;--neon:#4dffb0;--line:#12382b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px circle at 30% 20%,#06251b,#030907 60%);color:#e6f5ee;font:15px 'Instrument Sans',system-ui,sans-serif;overflow:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%}
#glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx,50%) var(--my,40%),rgba(77,255,176,.12),transparent 70%)}
.wrap{position:relative;perspective:900px;width:min(390px,92vw)}
.card{padding:2rem;border-radius:18px;border:1px solid var(--line);background:rgba(6,17,13,.62);backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(16,185,129,.12);transition:transform .15s;transform-style:preserve-3d;position:relative}
.card:before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 60%,var(--neon),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
h1{font:700 1.7rem Sora,system-ui;margin:0 0 .3rem;transform:translateZ(40px)}h1 b{color:var(--neon)}
p.s{margin:0 0 1.2rem;color:#8fb3a3}
label{display:block;font-size:.8rem;color:#8fb3a3;margin-top:.8rem}
input{width:100%;margin-top:.3rem;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--line);background:#06110d;color:#e6f5ee;font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 3px rgba(77,255,176,.15)}
.row{display:flex;gap:.6rem;margin-top:1.3rem}
button{flex:1;padding:.75rem;border-radius:10px;border:1px solid var(--em);background:linear-gradient(180deg,#0f9d6f,#0a6b4c);color:#fff;font:600 1rem inherit;cursor:pointer;transition:transform .15s,box-shadow .2s}
button:hover{box-shadow:0 0 26px rgba(16,185,129,.5)}button:active{transform:scale(.97)}
button.g{background:none;border-color:var(--line)}button[disabled]{opacity:.5}
#err{color:#ff6b6b;min-height:1.3em;margin:.8rem 0 0}
a{color:#8fb3a3;font-size:.85rem;display:block;text-align:center;margin-top:1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas><div id="glow"></div>
<div class="wrap" id="w"><form class="card" id="c" autocomplete="on">
<h1>Lead<b>Hunter</b></h1><p class="s">Entre para acessar seu painel.</p>
<label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required>
<label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" minlength="8" required>
<p id="err" role="alert"></p>
<div class="row"><button id="in" type="submit">Entrar</button><button id="up" type="button" class="g">Criar conta</button></div>
<a href="/">Voltar ao início</a></form></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches,mx=0,my=0,$=function(s){return document.querySelector(s)};
fetch('/api/me').then(function(r){if(r.ok)location.replace('/app')});
addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;if(RM)return;var g=$('#glow');g.style.setProperty('--mx',e.clientX+'px');g.style.setProperty('--my',e.clientY+'px');$('#c').style.transform='rotateY('+mx*10+'deg) rotateX('+-my*10+'deg)'});
function send(path){var b=$('#in'),u=$('#up');$('#err').textContent='';b.disabled=u.disabled=true;
fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#e').value,password:$('#p').value})})
.then(function(r){return r.json().then(function(d){return[r.ok,d]})}).then(function(x){if(x[0])location.href='/app';else{$('#err').textContent=x[1].error||'Tente novamente.';b.disabled=u.disabled=false}})
.catch(function(){$('#err').textContent='Sem conexao. Tente novamente.';b.disabled=u.disabled=false})}
$('#c').addEventListener('submit',function(e){e.preventDefault();send('login')});$('#up').onclick=function(){send('register')};
try{var cv=$('#bg'),rd=new THREE.WebGLRenderer({canvas:cv,alpha:true}),low=(navigator.hardwareConcurrency||4)<4||innerWidth<700;
rd.setPixelRatio(Math.min(devicePixelRatio,low?1:1.5));var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,50);cam.position.z=5;
var G=new THREE.Group();sc.add(G);var sg=low?18:30;
G.add(new THREE.Mesh(new THREE.SphereGeometry(1.5,sg,sg),new THREE.MeshBasicMaterial({color:0x04281d,transparent:true,opacity:.5})));
G.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(1.505,sg/2,sg/2)),new THREE.LineBasicMaterial({color:0x10b981,transparent:true,opacity:.3})));
function pts(n,r,s,c){var a=new Float32Array(n*3);for(var i=0;i<n;i++){var u=Math.random()*2-1,t=Math.random()*6.283,q=Math.sqrt(1-u*u);a[i*3]=r*q*Math.cos(t);a[i*3+1]=r*u;a[i*3+2]=r*q*Math.sin(t)}var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return new THREE.Points(g,new THREE.PointsMaterial({color:c,size:s,transparent:true,opacity:.9}))}
G.add(pts(low?50:120,1.52,.045,0x4dffb0));var orb=pts(low?150:400,3.2,.02,0x10b981);sc.add(orb);
function fit(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.position.x=innerWidth>800?-2.4:0;cam.updateProjectionMatrix()}fit();addEventListener('resize',fit);
(function l(){requestAnimationFrame(l);var k=RM?0:1;G.rotation.y+=.0025*k;G.rotation.x+=(my*.6-G.rotation.x)*.04;orb.rotation.y-=.0006*k;orb.rotation.x+=(my*.2-orb.rotation.x)*.03;rd.render(sc,cam)})()}catch(e){}
</script></body></html>
